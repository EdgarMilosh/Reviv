
name: CI

on:
  push:

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reviv
          POSTGRES_USER: reviv
          POSTGRES_PASSWORD: reviv
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U reviv -d reviv"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test backend
        working-directory: ./reviv-backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/reviv
          SPRING_DATASOURCE_USERNAME: reviv
          SPRING_DATASOURCE_PASSWORD: reviv
        run: |
          chmod +x ./gradlew
          ./gradlew clean build

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: reviv-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./reviv-frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./reviv-frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./reviv-frontend
        run: npm run build

  docker:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker compose file
        run: docker compose -f docker-compose.yml config --quiet

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t reviv-backend:ci ./reviv-backend

      - name: Build frontend image
        run: docker build -t reviv-frontend:ci ./reviv-frontend
