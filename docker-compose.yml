
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: reviv
      POSTGRES_USER: reviv
      POSTGRES_PASSWORD: reviv
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    image: gradle:8.14-jdk21
    working_dir: /app
    command: ["gradle", "bootRun", "--no-daemon"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/reviv
      SPRING_DATASOURCE_USERNAME: reviv
      SPRING_DATASOURCE_PASSWORD: reviv
    volumes:
      - ./reviv-backend:/app
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./reviv-frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - db

volumes:
  db-data:
