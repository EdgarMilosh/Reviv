
databaseChangeLog:
  - changeSet:
      id: 002-blood-test
      author: reviv
      changes:
        - createTable:
            tableName: blood_test
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: file_size
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: file_sha256
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: pdf_data
                  type: BYTEA
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  defaultValue: UPLOADED
                  constraints:
                    nullable: false

              - column:
                  name: uploaded_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: blood_test
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_blood_test_user
            onDelete: CASCADE

        - createIndex:
            tableName: blood_test
            indexName: idx_blood_test_user
            columns:
              - column:
                  name: user_id
