databaseChangeLog:
  - changeSet:
      id: 012-app-setting
      author: reviv
      changes:
        - createTable:
            tableName: app_setting
            columns:
              - column:
                  name: setting_key
                  type: VARCHAR(100)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: setting_value
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false