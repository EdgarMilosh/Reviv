databaseChangeLog:
  - changeSet:
      id: 013-dose-log
      author: reviv
      changes:
        - createTable:
            tableName: dose_log
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: plan_entry_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: dose_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: marked_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: dose_log
            baseColumnNames: plan_entry_id
            referencedTableName: consumption_plan_entry
            referencedColumnNames: id
            constraintName: fk_dose_log_entry
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: dose_log
            columnNames: plan_entry_id, dose_date
            constraintName: uk_dose_log_entry_date
        - sql:
            sql: |
              ALTER TABLE dose_log ADD CONSTRAINT ck_dose_log_status CHECK (status IN ('TAKEN', 'SKIPPED'));