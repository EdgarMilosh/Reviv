databaseChangeLog:
  - changeSet:
      id: 009-push-subscription
      author: reviv
      changes:
        - createTable:
            tableName: push_subscription
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: endpoint
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_push_subscription_endpoint
              - column:
                  name: p256dh
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: auth
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: push_subscription
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_push_subscription_user
            onDelete: CASCADE
        - createIndex:
            tableName: push_subscription
            indexName: idx_push_subscription_user
            columns:
              - column:
                  name: user_id