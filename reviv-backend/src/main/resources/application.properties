# Programos pavadinimas
spring.application.name=reviv

# Nuskaito slapta?od?ius ir nustatymus i? .env failo (jei jis yra)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Duomen? baz? (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${DB_NAME:reviv}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate: lenteles kuria Liquibase, Hibernate tik tikrina
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Liquibase migracijos
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

# Google ID ?etono tikrinimas
reviv.google-client-id=${GOOGLE_CLIENT_ID:nenurodyta}

# Sveikatos patikra (/actuator/health)
management.endpoints.web.exposure.include=health

# Reviv nustatymai
reviv.admin-emails=${ADMIN_EMAILS:}
reviv.cors-origins=${CORS_ORIGINS:http://localhost:5173}

# US-3 PDF upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

#OpenAI konfiguracija (extraction)
reviv.ai.enabled=${OPENAI_EXTRACTION_ENABLED:false}
reviv.ai.api-key=${OPENAI_API_KEY:}
reviv.ai.model=gpt-5.4-mini

# Saugumo ir islaidu ribojimai
reviv.ai.max-pdf-pages=5
reviv.ai.max-pdf-bytes=10485760
reviv.ai.max-attempts=2
reviv.ai.max-output-tokens=6000

# Rezultatu paaiskinimo API (gpt-6-luna)
reviv.analysis.enabled=${OPENAI_ANALYSIS_ENABLED:false}
reviv.analysis.model=${OPENAI_ANALYSIS_MODEL:gpt-6-luna}
reviv.analysis.max-output-tokens=5000
reviv.analysis.max-attempts=1

#Lokalus papildu rekomendacijuDI (ollama qwen3:14b)
reviv.recommendations.ollama.enabled=${OLLAMA_RECOMMENDATIONS_ENABLED:true}
reviv.recommendations.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
reviv.recommendations.ollama.model=${OLLAMA_MODEL:qwen3:14b}

reviv.plan.enabled=${OPENAI_PLAN_ENABLED:false}
reviv.plan.model=${OPENAI_PLAN_MODEL:gpt-6-luna}
reviv.plan.max-output-tokens=${OPENAI_PLAN_MAX_OUTPUT_TOKENS:6500}


# US-12 Web Push (VAPID)
reviv.push.public-key=${VAPID_PUBLIC_KEY:}
reviv.push.private-key=${VAPID_PRIVATE_KEY:}
reviv.push.subject=${VAPID_SUBJECT:mailto:admin@reviv.local}