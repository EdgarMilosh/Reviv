# Programos pavadinimas
spring.application.name=reviv

# Nuskaito slapta?od?ius ir nustatymus i? .env failo (jei jis yra)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Duomen? baz? (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${DB_NAME:reviv}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate: lenteles kuria Liquibase, Hibernate tik tikrina
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Liquibase migracijos
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

# Google ID ?etono tikrinimas
reviv.google-client-id=${GOOGLE_CLIENT_ID:nenurodyta}

# Sveikatos patikra (/actuator/health)
management.endpoints.web.exposure.include=health

# Reviv nustatymai
reviv.admin-emails=${ADMIN_EMAILS:}
reviv.cors-origins=${CORS_ORIGINS:http://localhost:5173}

# US-3 PDF upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB